c=en.indian%23holiday%40group.v.calendar.google.com&ctz=Asia%2FKolkata",piCalendarUrl:"https://calendar.google.com/calendar/embed?mode=WEEK&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&height=400&src=en.indian%23holiday%40group.v.calendar.google.com&ctz=Asia%2FKolkata",projectsSheetUrl:"https://docs.google.com/spreadsheets/d/12345abcdef/pubhtml?widget=true&amp;headers=false",projectsSheetEditUrl:"https://docs.google.com/spreadsheets/d/12345abcdef/edit"},Zn=[{id:"pi",name:"[PI Name]",role:"pi",roleLabel:"Faculty",photo:"pi.jpg",email:K.piEmail,website:"#",topic:"Principal Investigator"},{id:"phd-1",name:"[PhD Student 1]",role:"phd",photo:"phd1.jpg",email:"student1@iith.ac.in",topic:"Thermoacoustic instabilities"},{id:"phd-2",name:"[PhD Student 2]",role:"phd",photo:"phd2.jpg",email:"student2@iith.ac.in",topic:"Geometric control of UAVs"},{id:"phd-3",name:"[PhD Student 3]",role:"phd",photo:"phd3.jpg",email:"student3@iith.ac.in",topic:"Synchronization in oscillator networks"},{id:"ms-1",name:"[MS Student 1]",role:"ms",photo:"ms1.jpg",email:"ms1@iith.ac.in",topic:"Data-driven reduced-order models"},{id:"ms-2",name:"[MS Student 2]",role:"ms",photo:"ms2.jpg",email:"ms2@iith.ac.in",topic:"Koopman/DMD for reacting flows"},{id:"ug-1",name:"[BTP Student 1]",role:"undergrad",photo:"btp1.jpg",email:"btp1@iith.ac.in",topic:"Quadrotor state estimation"},{id:"alum-1",name:"[Alum 1]",role:"alumni",msThesis:"MS, IIT Hyderabad",nowAt:"Now at [Company / PhD program]",graduationYear:2024}],dy=[{label:"Faculty / PI",roles:["pi","faculty"]},{label:"Postdocs",roles:["postdoc"]},{label:"Visitors",roles:["visitor"],showTopic:!0},{label:"Staff",roles:["staff"]},{label:"PhD Students",roles:["phd"],showTopic:!0},{label:"MS (By Research) Students",roles:["ms"],showTopic:!0},{label:"BTP / Undergraduate Students",roles:["undergrad"]},{label:"Alumni",roles:["alumni"],isAlumni:!0}],vf=[{slug:"thermoacoustics",title:"Thermoacoustics and Instabilities",image:"thermoacoustics.jpg",summary:"System identification, reduced-order models, and data-driven prediction for thermoacoustic systems and flutter.",memberIds:["phd-1","ms-1","pi"],longDescription:`Thermoacoustic instability — the feedback between unsteady heat release and acoustic waves in a combustor — is a major technological problem in gas turbines, afterburners, and rocket engines, where it can lead to structural damage or catastrophic failure. At DysCo, we study the transition to instability using experiments on atmospheric-pressure bluff-body stabilized combustors and electrically heated Rijke tubes. We develop data-driven system-identification methods, reduced-order models built around the flame describing function and G-equation, and early-warning precursors (permutation entropy, ordinal pattern complexity, recurrence networks) that detect the onset of high-amplitude oscillations before they are visible in the raw pressure trace.

We also work on related aeroelastic problems such as flutter and limit-cycle oscillations in lifting surfaces.`,links:[{label:"System identification",url:"#"},{label:"Model order reduction",url:"#"},{label:"Stability analysis",url:"#"}]},{slug:"dynamical-systems-control",title:"Dynamical Systems and Control",image:"aerial-robotics.jpg",summary:"Control and learning strategies for dynamical systems, with an emphasis on aerial robotics.",memberIds:["phd-2","ug-1","pi"],longDescription:`This thrust lies at the intersection of nonlinear dynamical systems theory and modern control. A significant part of the work focuses on aerial robots — quadrotors, fixed-wing UAVs, and multi-vehicle teams — where we design geometric and optimal-control algorithms for aggressive and adaptive flight. Topics include geometric attitude/pose control on SO(3)/SE(3), robust and adaptive control for systems with unknown inertial parameters, distributed trajectory optimization for collaborative payload transport, and safety-critical control with learning-enabled components.

We also pursue fundamental questions in applied dynamical systems: bifurcations in piecewise-smooth systems, orbital stability, and the interplay between symmetry and controllability.`,links:[{label:"Aerial robotics",url:"#"},{label:"Optimal control",url:"#"},{label:"Applied mathematics",url:"#"}]},{slug:"complex-systems",title:"Complex Systems",image:"networks.jpg",summary:"Fluid flows, networks of oscillators, and human-centered system dynamics.",memberIds:["phd-3","ms-2","pi"],longDescription:`Many natural and engineered systems are composed of many interacting subsystems whose collective behavior cannot be read off from individual components. We investigate such complex systems in three related settings: wall-bounded and free-shear turbulent flows, networks of coupled nonlinear oscillators (including arrays of Rijke tubes), and signals from human-centered dynamical systems. Our tools include modern time-series analysis, network science, manifold learning, Dynamic Mode Decomposition, and Koopman-operator regression.

A recurring goal is to build interpretable, data-driven models that are physically consistent and that can be used for prediction and control.`,links:[{label:"Networks",url:"#"},{label:"Signals",url:"#"},{label:"Data-driven approaches",url:"#"}]},{slug:"rijke-network",title:"Networked Rijke-tube experiments",image:"rijke.jpg",summary:"A modular experimental platform for synchronization studies in coupled thermoacoustic oscillators.",memberIds:["phd-3","phd-1","pi"],longDescription:"We maintain an array of electrically driven and flame-driven Rijke tubes whose coupling strengths can be varied continuously. The rig serves as a testbed for phase-reduction analysis, cluster synchronization, and data-driven discovery of coupling topologies.",links:[]},{slug:"koopman-fluids",title:"Koopman / DMD modeling of turbulent wakes",image:"wake.jpg",summary:"Extracting low-dimensional, predictive models from high-dimensional flow data.",memberIds:["ms-2","pi"],longDescription:"Dynamic Mode Decomposition and related Koopman-operator methods provide a linear-regression framework for building data-driven models of strongly nonlinear flows. We apply these methods to time-resolved PIV data of wake flows and reacting flows, and study how randomized forcing and known conservation laws can be incorporated into the regression.",links:[]},{slug:"flame-dynamics",title:"Flame dynamics and reduced-order combustion models",image:"flame.jpg",summary:"Kinematic G-equation models and flame describing functions for acoustically forced premixed flames.",memberIds:["phd-1","pi"],longDescription:"We study the kinematic response of premixed flames to acoustic excitation, derive low-order flame describing functions, and embed them in acoustic network models for can and annular combustors.",links:[]}],my=[{title:"Geometric adaptive control for quadrotor UAVs with unknown rotor dynamics",authors:"[PhD Student 2]*, [PI Name]",venue:"IEEE Conference on Decision and Control (CDC)",location:"Rio de Janeiro, Brazil",year:2025,month:"December",note:"(To appear)",type:"conference",links:[{label:"PDF",url:"#"}]},{title:"Sparse nonlinear identification of thermoacoustic dynamics near instability onset",authors:"[PhD Student 1]*, [MS Student 1]*, [PI Name]",venue:"Journal of Fluid Mechanics",year:2025,month:"June",note:"(Submitted)",type:"journal",links:[{label:"arXiv",url:"#"},{label:"PDF",url:"#"}]},{title:"Early detection of thermoacoustic instability using ordinal-pattern complexity",authors:"[PhD Student 1]*, [PI Name]",venue:"Combustion and Flame",year:2024,month:"December",type:"journal",links:[{label:"DOI",url:"#"},{label:"PDF",url:"#"}]},{title:"Koopman-operator modeling of turbulent wake flows with randomized forcing",authors:"[MS Student 2]*, [PI Name]",venue:"Physical Review Fluids",year:2024,month:"September",type:"journal",links:[{label:"DOI",url:"#"},{label:"arXiv",url:"#"}]},{title:"Synchronization in networks of thermoacoustic oscillators: cluster states and chimeras",authors:"[PhD Student 3]*, [PI Name]",venue:"Chaos: An Interdisciplinary Journal of Nonlinear Science",year:2024,month:"July",type:"journal",links:[{label:"DOI",url:"#"}]},{title:"Trajectory optimization for multi-UAV collaborative payload transport",authors:"[PhD Student 2]*, [BTP Student 1]*, [PI Name]",venue:"AIAA SciTech Forum",location:"Orlando, FL",year:2024,month:"January",type:"conference",links:[{label:"PDF",url:"#"}]},{title:"A reduced-order framework for limit-cycle prediction in ducted premixed flames",authors:"[PhD Student 1]*, [PI Name]",venue:"Proceedings of the Combustion Institute",year:2023,month:"December",type:"journal",links:[{label:"DOI",url:"#"},{label:"PDF",url:"#"}]},{title:"Recurrence-network analysis of intermittency prior to thermoacoustic instability",authors:"[PI Name], [PhD Student 1]*",venue:"Nonlinear Dynamics",year:2023,month:"October",type:"journal",links:[{label:"DOI",url:"#"}]},{title:"Robust geometric attitude control on SO(3) with bounded disturbances",auth
